[theme]
base = "light"
primaryColor = "#2a78d6"
blueColor = "#2a78d6"
blueTextColor = "#2a78d6"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f1efe9"
textColor = "#1a1a19"
linkColor = "#2a78d6"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap, serif"
baseFontSize = 18
headingFontSizes = ["3.2rem", "2.1rem", "1.55rem", "1.25rem"]
headingFontWeights = [600, 600, 600, 600]
metricValueFontSize = "2.6rem"
baseRadius = "0.75rem"
borderColor = "#e6e3dc"
dataframeHeaderBackgroundColor = "#f1efe9"

[theme.sidebar]
backgroundColor = "#f4f2ec"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
